<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Industry Radar — The Sectors Where India Is Hiring and Building</title>
    <meta name="description" content="Industry Radar — Explore key growth sectors in India and how SkillWiz connects preparation to career pathways.">
    <link rel="canonical" href="https://www.myskillwiz.com/industryradar.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.myskillwiz.com/industryradar.html">
    <meta property="og:site_name" content="SkillWiz">
    <meta property="og:title" content="Industry Radar — The Sectors Where India Is Hiring and Building">
    <meta property="og:description" content="Explore key growth sectors in India and how SkillWiz connects preparation to career pathways.">
    <meta property="og:image" content="https://www.myskillwiz.com/assets/images/og-share.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.myskillwiz.com/industryradar.html">
    <meta name="twitter:title" content="Industry Radar — The Sectors Where India Is Hiring and Building">
    <meta name="twitter:description" content="Explore key growth sectors in India and how SkillWiz connects preparation to career pathways.">
    <meta name="twitter:image" content="https://www.myskillwiz.com/assets/images/og-share.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* ─── BASE & ROOT VARIABLES ─── */
        :root {
            --radar-green: #0F5132;
            --radar-green-deep: #0A3A24;
            --radar-orange: #F47B20;
            --radar-orange-deep: #D9640F;
            --radar-cream: #FFF5E8;
            --radar-paper: #FFFFFF;
            --radar-ink: #18231D;
            --radar-muted: #5B6660;
            --radar-line: #E6DDCC;
            --radar-gold: #E9B824;
            --radar-font-display: 'Anton', 'Impact', sans-serif;
            --radar-font-body: 'Manrope', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #F8F5F0;
            font-family: var(--radar-font-body);
            color: var(--radar-ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── COMPONENT CONTAINER ─── */
        .radar-container {
            max-width: 1120px;
            margin: 0 auto;
        }

        .radar-title {
            font-family: var(--radar-font-display);
            text-transform: uppercase;
            letter-spacing: .02em;
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            color: var(--radar-green);
            margin: 0 0 8px;
            line-height: 1.15;
        }

        .radar-rule {
            height: 4px;
            width: 100%;
            background: var(--radar-orange);
            border: none;
            margin: 0 0 16px;
        }

        .radar-subtitle {
            font-size: 1.05rem;
            color: var(--radar-muted);
            margin: 0 0 24px;
            max-width: 72ch;
        }

        /* ─── SECTOR BUTTONS GRID ─── */
        .sectors {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .sectors button {
            font-family: var(--radar-font-display);
            text-transform: uppercase;
            text-align: center;
            padding: 8px 6px;
            font-size: .84rem;
            letter-spacing: .02em;
            color: var(--radar-green);
            background: #ffffff;
            border: 1.5px solid var(--radar-line);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            min-height: 36px;
            user-select: none;
            transition: border-color .15s, background .15s, color .15s, box-shadow .15s, transform .15s;
        }

        .sectors button:hover {
            border-color: var(--radar-orange);
            transform: translateY(-1px);
        }

        .sectors button[aria-pressed="true"] {
            background: var(--radar-green);
            color: #ffffff;
            border-color: var(--radar-green);
            box-shadow: 0 3px 0 var(--radar-orange);
            transform: translateY(-1px);
        }

        .sectors button:focus-visible {
            outline: 2.5px solid var(--radar-gold);
            outline-offset: 1px;
        }

        @media (max-width: 960px) {
            .sectors {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 640px) {
            .sectors {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 440px) {
            .sectors {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ─── RADAR DETAIL CARD ─── */
        .radar {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            gap: 20px;
            background: #ffffff;
            border: 1px solid var(--radar-line);
            border-left: 5px solid var(--radar-orange);
            border-radius: 0 12px 12px 0;
            padding: 18px 22px;
            box-shadow: 0 4px 18px rgba(15, 81, 50, 0.05);
            animation: radarFadeIn .25s ease-out;
        }

        @keyframes radarFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .radar>* {
            min-width: 0;
        }

        .radar h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--radar-green);
            margin: 0 0 4px;
            line-height: 1.2;
        }

        .radar p {
            margin: 0;
            color: var(--radar-ink);
            font-size: .9rem;
            line-height: 1.45;
        }

        .radar .lbl {
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--radar-orange-deep);
            margin: 8px 0 5px;
        }

        .rtags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .rtags span {
            background: var(--radar-cream);
            border: 1px solid var(--radar-line);
            border-radius: 999px;
            padding: 3px 9px;
            font-size: .78rem;
            font-weight: 600;
            color: var(--radar-ink);
        }

        /* ─── RADAR SIDEBAR PANEL ─── */
        .radar .help {
            background: var(--radar-cream);
            padding: 14px 16px;
            border-radius: 10px;
            align-self: start;
            border: 1px solid #EFE4D2;
        }

        .radar .fine {
            font-size: .75rem;
            color: var(--radar-muted);
            display: block;
        }

        .radar .help p {
            margin: 5px 0 10px;
            font-weight: 600;
            color: var(--radar-ink);
            font-size: .84rem;
            line-height: 1.4;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 800;
            font-family: var(--radar-font-body);
            padding: 11px 18px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s, transform .15s;
        }

        .btn-primary {
            background: var(--radar-orange);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--radar-orange-deep);
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 9px 15px;
            font-size: .88rem;
        }

        @media (max-width: 820px) {
            .radar {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════ HTML START ═══════════════════════ -->
    <section class="radar-container" id="industry-radar-section">
        <h2 class="radar-title">Industry Radar</h2>
        <hr class="radar-rule">
        <p class="radar-subtitle">
            Select a sector to explore the emerging roles students build towards, key competencies required, and how
            verified capability preparation aligns with industry demand.
        </p>

        <!-- 12 Sector selection buttons -->
        <div class="sectors" id="sectors" role="tablist" aria-label="Industry sectors">
            <button type="button" role="tab" aria-pressed="true" aria-selected="true">Chip design</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Defence technology</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">EV &amp; battery</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Autonomous driving</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Logistics</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">AI technology</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Robotics</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Space technology</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Biotechnology</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Manufacturing</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Ordnance &amp; missile
                tech</button>
            <button type="button" role="tab" aria-pressed="false" aria-selected="false">Cyber security</button>
        </div>

        <!-- Dynamic details panel -->
        <div class="radar" id="radar" aria-live="polite"></div>
    </section>
    <!-- ════════════════════════ HTML END ════════════════════════ -->

    <!-- ═════════════════════ JAVASCRIPT ════════════════════════ -->
    <script>
        (function initIndustryRadar() {
            // 12 Sectors Dataset: [Sector Name, Overview, Roles Aimed For, Skills to Build, Preparation Method]
            const R = [
                [
                    "Chip design",
                    "India is building a semiconductor design talent base. ECE graduates with verified fundamentals are the entry point.",
                    ["VLSI design engineer", "Verification engineer", "Physical design engineer", "Embedded engineer"],
                    ["Digital design", "Verilog / SystemVerilog", "Computer architecture", "EDA tool basics"],
                    "ECE-specific PlaceMe content, chip-design pathways with an OEM partner in Germany, and project evidence recorded in the Karm-Patri."
                ],
                [
                    "Defence technology",
                    "Defence electronics, avionics and systems need engineers who can show applied, tested capability.",
                    ["Embedded systems engineer", "Signal processing engineer", "Systems integration engineer", "Test and quality engineer"],
                    ["Embedded C / C++", "Control systems", "RF and communications basics", "Systems thinking"],
                    "Core-technical baselines, project evidence from labs and Centres of Excellence, and orientation to the sector from Year 2."
                ],
                [
                    "EV & battery",
                    "Electric mobility and energy storage are creating roles across electrical, mechanical and software streams.",
                    ["Battery systems engineer", "Power electronics engineer", "Vehicle software engineer", "Manufacturing engineer"],
                    ["Power electronics", "Battery management basics", "Embedded software", "CAD and thermal basics"],
                    "EE and ME core assessments, EV and battery labs, and a visible path from project to role."
                ],
                [
                    "Autonomous driving",
                    "Perception, planning and control combine software, sensors and safety thinking.",
                    ["Perception engineer", "Controls engineer", "Simulation engineer", "Embedded software engineer"],
                    ["Python and C++", "Linear algebra and probability", "Sensor basics", "Machine learning foundations"],
                    "Coding and cognitive baselines, N2N coding practice and live-project evidence."
                ],
                [
                    "Logistics",
                    "Supply chains are being rebuilt around data, automation and visibility.",
                    ["Supply-chain analyst", "Operations planner", "Warehouse automation engineer", "Data analyst"],
                    ["Data analysis", "Operations research basics", "ERP familiarity", "Communication"],
                    "Management-stream baselines, analytics credentials with partners and company-specific mocks."
                ],
                [
                    "AI technology",
                    "AI is moving from labs into every sector, with demand for builders and for people who can apply it.",
                    ["ML engineer", "Data scientist", "AI product analyst", "MLOps engineer"],
                    ["Python", "Statistics", "Machine learning", "Problem framing"],
                    "AI/ML credentials with partners, coding practice, and projects verified in the Karm-Patri."
                ],
                [
                    "Robotics",
                    "Robots combine mechanics, electronics and software; teams need all three.",
                    ["Robotics engineer", "Mechatronics engineer", "Automation engineer", "Embedded engineer"],
                    ["Embedded systems", "Kinematics basics", "Control systems", "ROS and simulation"],
                    "Robotics and innovation labs on campus, with student projects recorded as evidence."
                ],
                [
                    "Space technology",
                    "A growing private space ecosystem is hiring for design, testing and data.",
                    ["Avionics engineer", "Mission analyst", "Satellite systems engineer", "Ground-systems software engineer"],
                    ["Embedded systems", "Signals and systems", "Python", "Systems engineering basics"],
                    "Core-technical assessment, hackathons and showcases that turn projects into verified proof."
                ],
                [
                    "Biotechnology",
                    "Bioscience, health and agriculture need graduates who can work with data and instruments.",
                    ["Bioinformatics analyst", "Research associate", "Quality and regulatory associate", "Process development associate"],
                    ["Lab practice", "Data analysis", "Statistics", "Documentation and compliance"],
                    "One Karm-Patri framework configured for science, health science and agriculture, not only engineering."
                ],
                [
                    "Manufacturing",
                    "Smarter factories need engineers who understand process, quality and automation.",
                    ["Production engineer", "Quality engineer", "Industrial automation engineer", "Design engineer"],
                    ["CAD", "Process and quality tools", "PLC and automation basics", "Lean basics"],
                    "ME and EE core assessments, industry programmes with partners, and Day-0 productivity training."
                ],
                [
                    "Ordnance & missile tech",
                    "Strategic manufacturing and propulsion need rigorous engineers with verified fundamentals.",
                    ["Mechanical design engineer", "Materials engineer", "Control and guidance engineer", "Test engineer"],
                    ["Mechanics and thermodynamics", "Materials basics", "Control systems", "Precision and documentation"],
                    "Core-technical baselines in ME, EE and ECE, with verified project evidence for specialist recruiters."
                ],
                [
                    "Cyber security",
                    "Every organisation now needs people who can defend systems and respond to incidents.",
                    ["Security analyst", "SOC analyst", "Penetration tester", "Cloud security engineer"],
                    ["Networking", "Operating systems", "Scripting", "Security fundamentals"],
                    "Cyber security micro-credentials with an Australian partner, recorded in the Karm-Patri."
                ]
            ];

            const sec = document.getElementById("sectors");
            const box = document.getElementById("radar");
            const buttons = sec.querySelectorAll("button");

            function esc(str) {
                return (str || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function selectSector(index) {
                buttons.forEach((btn, j) => {
                    const isActive = (j === index);
                    btn.setAttribute("aria-pressed", isActive ? "true" : "false");
                    btn.setAttribute("aria-selected", isActive ? "true" : "false");
                });

                const r = R[index];
                box.innerHTML = `
          <div>
            <h3>${esc(r[0])}</h3>
            <p style="margin:8px 0 0">${esc(r[1])}</p>
            <div class="lbl">Roles students aim for</div>
            <div class="rtags">${r[2].map(x => `<span>${esc(x)}</span>`).join("")}</div>
            <div class="lbl">Skills to build</div>
            <div class="rtags">${r[3].map(x => `<span>${esc(x)}</span>`).join("")}</div>
          </div>
          <div class="help">
            <span class="fine">How preparation connects</span>
            <p>${esc(r[4])}</p>
            <button type="button" class="btn btn-primary btn-sm">Explore ${esc(r[0])}</button>
            <span class="fine" style="margin-top:12px">General orientation and competency pathway.</span>
          </div>
        `;
            }

            buttons.forEach((btn, i) => {
                btn.addEventListener("click", () => selectSector(i));
            });

            // Initialize with first sector
            selectSector(0);
        })();
    </script>
</body>

</html>
